owner: zebby76
repo: upptime
user-agent: zebby76
assignees:
  - zebby76

# MEASURED, 2026-11-09: this asks for 288 runs a day and GitHub delivered 3 in twenty hours --
# 1.2%. The `schedule` event is best-effort with no SLA, and GitHub honours spaced crons (every
# daily workflow here ran exactly once, on time) while gutting close-together ones. 5 minutes is a
# floor on what you may ASK, not a promise of delivery.
#
# The offsets are GitHub's own documented mitigation: "high load times include the start of every
# hour", so these fire at :03 rather than :00. Expectation set deliberately low -- if the throttle
# is priority-based rather than load-based this changes nothing, and the real cadence stays hours.
# A genuine 5-minute cadence needs `repository_dispatch` from an outside clock, which means a token
# of this account living at a third party; declined on purpose.
workflowSchedule:
  uptime: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"

# 2 s between endpoints instead of 15 simultaneous requests through the tunnel — it also keeps the
# run clear of stickers' nginx limit_req.
delay: 2000

# Allowlist: a check can only read the secrets named here.
secrets:
  - NOTIFICATION_CUSTOM_WEBHOOK
  - NOTIFICATION_CUSTOM_WEBHOOK_URL

status-website:
  cname: status.zebbox.net
  name: zebbox.net
  theme: dark
  introTitle: "État des services publics de zebbox.net"
  introMessage: >
    Sondé depuis GitHub Actions, c'est-à-dire **hors du cluster surveillé** : une panne
    d'électricité, de réseau ou du cluster lui-même n'emporte pas cette page.


    **La cadence réelle est de l'ordre de quelques heures**, pas des cinq minutes demandées :
    l'événement planifié de GitHub Actions est « au mieux », sans engagement, et n'honore pas les
    planifications rapprochées — mesuré le 2026-11-09, 3 exécutions livrées sur 240 demandées.
    Cette page dit donc **si** un service répond, pas **quand** il est tombé à la minute.


    Les services marqués *(ingress + SSO)* sont protégés par l'authentification unique. La sonde
    s'arrête donc à la porte : elle prouve que l'entrée et le SSO répondent, **pas** que
    l'application derrière fonctionne.

sites:
  # ── Ce qui répond directement, sans authentification intermédiaire.
  - name: www.zebbox.net
    slug: www
    url: https://www.zebbox.net/
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000

  - name: oria — portail
    slug: oria-portail
    url: https://oria.zebbox.net/
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000

  - name: oria — monde 1
    slug: oria-monde-1
    url: https://oria-w1.zebbox.net/
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000

  - name: oria — monde 2
    slug: oria-monde-2
    url: https://oria-w2.zebbox.net/
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000

  - name: oria — monde 3
    slug: oria-monde-3
    url: https://oria-w3.zebbox.net/
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000

  - name: stickers
    slug: stickers
    url: https://stickers.zebbox.net/
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000

  - name: auth (Authelia)
    slug: auth
    url: https://auth.zebbox.net/
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
    # Même contrôle : un 200 d'Authelia qui ne sert pas sa page de connexion n'est pas un succès.
    __dangerous__body_down_if_text_missing: '<base href="https://auth.zebbox.net/"'

  - name: ntfy
    slug: ntfy
    url: https://ntfy.zebbox.net/
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000

  - name: vault (Vaultwarden)
    slug: vault
    url: https://vault.zebbox.net/
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000

  # ── Interceptés par Authelia. Upptime SUIT les redirections : il reçoit le 200 final de la page
  # de connexion, pas le 302 initial que `curl` sans -L montre. Déclarer 302 ici marque les six
  # hôtes en panne — vérifié à mes dépens le 2026-11-08, six fausses alertes envoyées.
  #
  # Le code seul ne prouve donc plus rien, puisqu'un hôte protégé et un hôte qui ne l'est PLUS
  # finissent tous deux en 200. D'où le contrôle de corps : `<base href="https://auth.zebbox.net/"`
  # est posé par Authelia et par personne d'autre — vérifié absent de www, oria, stickers, ntfy et
  # vault, présent sur auth. Si le SSO cessait de protéger un hôte, la réponse serait le corps de
  # l'application et la chaîne disparaîtrait, donc la sonde passerait au rouge.
  - name: gt7 (ingress + SSO)
    slug: gt7
    url: https://gt7.zebbox.net/
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: '<base href="https://auth.zebbox.net/"'

  - name: chat (ingress + SSO)
    slug: chat
    url: https://chat.zebbox.net/
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: '<base href="https://auth.zebbox.net/"'

  - name: grafana (ingress + SSO)
    slug: grafana
    url: https://grafana.zebbox.net/
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: '<base href="https://auth.zebbox.net/"'

  - name: n8n (ingress + SSO)
    slug: n8n
    url: https://n8n.zebbox.net/
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: '<base href="https://auth.zebbox.net/"'

  - name: adguard (ingress + SSO)
    slug: adguard
    url: https://adguard.zebbox.net/
