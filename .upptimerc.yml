  - name: vault (Vaultwarden)
    slug: vault
    url: https://vault.zebbox.net/
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000

  # ── Interceptés par Authelia : un 302 EST l'état sain. Le code est déclaré exactement et non
  # laissé au défaut d'Upptime (tout 2xx/3xx compte comme « up »), parce qu'un 200 ici signifierait
  # qu'Authelia a cessé de protéger l'hôte — une régression de sécurité que le défaut masquerait.
  - name: gt7 (ingress + SSO)
    slug: gt7
    url: https://gt7.zebbox.net/
    expectedStatusCodes:
      - 302
    maxResponseTime: 5000

  - name: chat (ingress + SSO)
    slug: chat
    url: https://chat.zebbox.net/
    expectedStatusCodes:
      - 302
    maxResponseTime: 5000

  - name: grafana (ingress + SSO)
