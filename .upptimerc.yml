owner: zebby76
repo: upptime
user-agent: zebby76
assignees:
  - zebby76

# 5 minutes is GitHub Actions' floor for a scheduled workflow, so this is as fine-grained as
# Upptime gets. The sub-minute ingress flaps of roadmap #32 will be missed by design.
workflowSchedule:
  uptime: "*/5 * * * *"

# 2 s between endpoints instead of 15 simultaneous requests through the tunnel — it also keeps the
# run clear of stickers' nginx limit_req.
delay: 2000

# Allowlist: a check can only read the secrets named here.
secrets:
  - NOTIFICATION_CUSTOM_WEBHOOK
  - NOTIFICATION_CUSTOM_WEBHOOK_URL

status-website:
  cname: status.zebbox.net
  name: zebbox.net
  theme: dark
  introTitle: "État des services publics de zebbox.net"
  introMessage: >
    Sondé toutes les 5 minutes depuis GitHub Actions, c'est-à-dire **hors du cluster surveillé** :
    une panne d'électricité, de réseau ou du cluster lui-même n'emporte pas cette page.


    Les services marqués *(ingress + SSO)* sont protégés par l'authentification unique. La sonde
    s'arrête donc à la porte : elle prouve que l'entrée et le SSO répondent, **pas** que
    l'application derrière fonctionne.

sites:
  # ── Ce qui répond directement, sans authentification intermédiaire.
  - name: www.zebbox.net
    slug: www
    url: https://www.zebbox.net/
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000

  - name: oria — portail
    slug: oria-portail
    url: https://oria.zebbox.net/
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000

  - name: oria — monde 1
    slug: oria-monde-1
    url: https://oria-w1.zebbox.net/
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000

  - name: oria — monde 2
    slug: oria-monde-2
    url: https://oria-w2.zebbox.net/
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000

  - name: oria — monde 3
    slug: oria-monde-3
